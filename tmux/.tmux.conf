# tmux — Rose Pine rice (no plugin manager needed)

# 256color + true color passthrough
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB,xterm-256color:RGB"

# behavior
set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on
setw -g mode-keys vi
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g set-clipboard on

# panes: split with | and -, navigate with alt-hjkl (works without prefix)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# copy mode: v to select, y to copy (vi style)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# reload config
bind r source-file ~/.tmux.conf \; display "tmux reloaded"

# ---- Rose Pine Main ----
thm_bg="#191724"
thm_surface="#1f1d2e"
thm_overlay="#26233a"
thm_muted="#6e6a86"
thm_text="#e0def4"
thm_rose="#ebbcba"
thm_love="#eb6f92"
thm_gold="#f6c177"
thm_iris="#c4a7e7"

set -g mode-style "fg=$thm_rose,bg=$thm_overlay"
set -g message-style "fg=$thm_text,bg=$thm_overlay"
set -g message-command-style "fg=$thm_text,bg=$thm_overlay"

set -g pane-border-style "fg=$thm_overlay"
set -g pane-active-border-style "fg=$thm_rose"

set -g status-position bottom
set -g status on
set -g status-interval 5
set -g status-style "bg=$thm_bg,fg=$thm_muted"

set -g status-left-length 40
set -g status-left "#[fg=$thm_bg,bg=$thm_iris,bold] #S #[fg=$thm_iris,bg=$thm_bg] "

set -g status-right-length 60
set -g status-right "#[fg=$thm_muted]%b %d %H:%M #[fg=$thm_bg,bg=$thm_gold,bold] #h "

setw -g window-status-format "#[fg=$thm_muted,bg=$thm_bg]#I #[fg=$thm_muted]#W"
setw -g window-status-current-format "#[fg=$thm_bg,bg=$thm_rose,bold] #I #W "
setw -g window-status-separator ""
