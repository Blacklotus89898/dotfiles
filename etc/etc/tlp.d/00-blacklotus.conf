# Battery & power tuning (drop-in for /etc/tlp.conf)
# laptop battery health: keep between 75-80% when plugged in
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# CPU: favor efficiency on battery, performance on AC
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# aggressive runtime PM on battery
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# wifi power save on battery
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# suspend to RAM rather than s2idle where supported
SLEEP_SUSPEND=platform
