# picom — Rose Pine rice
# rounded corners, soft shadows, subtle blur & dim (picom >= v10 syntax)

backend = "glx";
vsync = true;

# fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.08;
fade-delta = 6;

# rounded corners everywhere, incl. borders
corner-radius = 10;
rounded-borders = true;

# soft shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g = 'dunst'",
    "_GTK_FRAME_EXTENTS@:c"
];

# dim unfocused windows very slightly
inactive-dim = 0.04;

# gentle background blur behind translucent windows
blur: {
    method = "dual_kawase";
    strength = 3;
    background = false;
    blur-background-exclude = [
        "class_g = 'slop'",
        "_GTK_FRAME_EXTENTS@:c"
    ];
}

# treat rofi/dunst as floating overlays
wintypes: {
    dock = { shadow = false; };
    dnd = { shadow = false; };
    tooltip = { shadow = true; shadow-radius = 8; focus = true; };
    notification = { shadow = false; corner-radius = 12; };
    popup_menu = { shadow = true; corner-radius = 8; opacity = 0.95; };
    dropdown_menu = { shadow = true; corner-radius = 8; opacity = 0.95; };
}

detect-transient = true;
detect-client-opacity = true;
log-level = "warn";
